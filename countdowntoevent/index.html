<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyEvents">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#da0037">

    <title>Event Countdown</title>
    <style>
        :root {
            --primary: #da0037;
            --primary-hover: #b9002d;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #171717;
            --text-muted: #525252;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOGIN OVERLAY STYLES --- */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .login-title {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .pin-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .pin-input:focus {
            border-color: var(--primary);
        }

        .unlock-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .error-msg {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* --- APP CONTENT (Hidden initially) --- */
        #appContent {
            display: none; 
        }

        .container {
            width: 100%;
            margin: 0 auto;
            padding-bottom: 50px;
            /* Default Mobile Width */
            max-width: 600px; 
            transition: max-width 0.3s ease;
        }

        header { text-align: center; margin-bottom: 2rem; margin-top: 1rem; }
        h1 { margin: 0; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }
        .live-clock { font-size: 2rem; font-weight: 800; color: var(--text-main); line-height: 1.1; }
        
        .add-event-card { background: var(--card-bg); padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 2rem; border-top: 4px solid var(--primary); }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
        input.app-input { width: 100%; padding: 0.8rem; border: 2px solid #e5e5e5; border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: #fff; -webkit-appearance: none; }
        input.app-input:focus { border-color: var(--primary); outline: none; }
        button.add-btn { background-color: var(--primary); color: white; border: none; padding: 1rem; border-radius: 8px; font-size: 1rem; font-weight: 700; width: 100%; cursor: pointer; margin-top: 0.5rem; box-shadow: 0 4px 6px rgba(218, 0, 55, 0.2); }
        button.add-btn:active { transform: scale(0.98); }

        /* --- RESPONSIVE GRID --- */
        .events-grid {
            display: grid;
            gap: 1rem;
            /* Default Mobile: 1 Column */
            grid-template-columns: 1fr; 
        }

        .event-card { background: var(--card-bg); border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; border-left: 4px solid transparent; transition: transform 0.2s; }
        .event-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-left-color: var(--primary); }

        .event-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .event-title { font-size: 1.2rem; font-weight: 700; margin: 0; word-break: break-word; }
        .event-date { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 0.25rem; }
        .delete-btn { background: none; border: none; color: #d1d5db; font-size: 1.5rem; padding: 0 0 0 1rem; cursor: pointer; }
        .delete-btn:hover { color: var(--primary); }

        .timer-display { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.25rem; text-align: center; background: #fff1f2; padding: 0.75rem 0.25rem; border-radius: 8px; }
        .unit-value { font-size: 1.4rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
        .unit-label { font-size: 0.6rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-style: italic; border: 2px dashed #e5e5e5; border-radius: 12px; }
        .event-finished { text-align: center; color: #16a34a; font-weight: bold; padding: 0.5rem; background: #dcfce7; border-radius: 8px; }

        /* --- DESKTOP MEDIA QUERY --- */
        @media (min-width: 768px) {
            .container {
                max-width: 1000px; /* Wider container for desktop */
                padding: 2rem;
            }

            .events-grid {
                /* Create as many 300px columns as fit */
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
                gap: 1.5rem;
            }

            .add-event-card {
                /* Make the input form horizontal on desktop */
                flex-direction: row;
                display: flex;
                gap: 1rem;
                align-items: flex-end;
            }
            
            .input-group {
                margin-bottom: 0;
                flex: 1;
            }
            
            button.add-btn {
                width: auto;
                margin-top: 0;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 class="login-title">Locked</h2>
            <input type="tel" id="pinInput" class="pin-input" placeholder="PIN" maxlength="4" autocomplete="off">
            <button class="unlock-btn" onclick="checkPin()">Unlock</button>
            <div id="loginError" class="error-msg">Incorrect PIN</div>
        </div>
    </div>

    <div id="appContent" class="container">
        <header>
            <h1>Current Time</h1>
            <div id="liveClock" class="live-clock">...</div>
        </header>

        <div class="add-event-card">
            <div class="input-group">
                <label>Event Name</label>
                <input type="text" id="eventName" class="app-input" placeholder="e.g. Birthday">
            </div>
            <div class="input-group">
                <label>Date & Time</label>
                <input type="datetime-local" id="eventDate" class="app-input">
            </div>
            <button class="add-btn" onclick="addEvent()">+ Add Event</button>
        </div>

        <div id="eventsGrid" class="events-grid"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const APP_PIN = "0503"; // <--- CHANGE YOUR PASSWORD HERE
        // ---------------------

        const STORAGE_KEY = 'mobile_countdowns_v2'; 
        let events = [];

        // --- AUTH LOGIC ---
        const pinInput = document.getElementById('pinInput');
        const loginError = document.getElementById('loginError');

        pinInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPin();
            }
        });

        function checkPin() {
            if (pinInput.value === APP_PIN) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                initApp();
            } else {
                loginError.style.display = 'block';
                pinInput.value = '';
                pinInput.focus();
            }
        }

        // --- APP LOGIC ---
        function initApp() {
            const nowLocal = new Date();
            nowLocal.setMinutes(nowLocal.getMinutes() - nowLocal.getTimezoneOffset());
            document.getElementById('eventDate').min = nowLocal.toISOString().slice(0, 16);

            loadEvents();
            setInterval(updateTimers, 1000);
            updateTimers(); 
        }

        function loadEvents() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                events = JSON.parse(stored);
                renderEvents();
            } else {
                renderEmptyState();
            }
        }

        function saveEvents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        }

        function addEvent() {
            const nameInput = document.getElementById('eventName');
            const dateInput = document.getElementById('eventDate');
            const name = nameInput.value.trim();
            const dateStr = dateInput.value;

            if (!name || !dateStr) {
                alert("Please fill in both fields.");
                return;
            }

            events.push({ id: Date.now(), name: name, date: dateStr });
            saveEvents();
            nameInput.value = '';
            dateInput.value = '';
            renderEvents();
        }

        function deleteEvent(id) {
            if(confirm('Remove this event?')) {
                events = events.filter(e => e.id !== id);
                saveEvents();
                renderEvents();
            }
        }

        function renderEmptyState() {
            document.getElementById('eventsGrid').innerHTML = 
                `<div class="empty-state">No events yet.<br>Add one above!</div>`;
        }

        function renderEvents() {
            const grid = document.getElementById('eventsGrid');
            if (events.length === 0) { renderEmptyState(); return; }
            
            grid.innerHTML = '';
            events.sort((a, b) => new Date(a.date) - new Date(b.date));

            events.forEach(event => {
                const dateObj = new Date(event.date);
                const dateDisplay = dateObj.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + 
                                  ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-header">
                        <div>
                            <div class="event-title">${event.name}</div>
                            <div class="event-date">${dateDisplay}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteEvent(${event.id})">×</button>
                    </div>
                    <div id="timer-${event.id}"></div>
                `;
                grid.appendChild(card);
            });
            updateTimers();
        }

        function updateTimers() {
            const nowObj = new Date();
            const now = nowObj.getTime();

            document.getElementById('liveClock').innerHTML = 
                nowObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + 
                '<span style="font-size:0.5em; display:block; color:var(--primary); font-weight:600">' + 
                nowObj.toLocaleDateString(undefined, { weekday:'short', month:'long', day:'numeric' }) + '</span>';

            events.forEach(event => {
                const container = document.getElementById(`timer-${event.id}`);
                if (!container) return;
                const distance = new Date(event.date).getTime() - now;

                if (distance < 0) {
                    container.innerHTML = `<div class="event-finished">Done!</div>`;
                } else {
                    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((distance % (1000 * 60)) / 1000);
                    const pad = n => n < 10 ? '0'+n : n;

                    container.innerHTML = `
                        <div class="timer-display">
                            <div class="time-unit"><div class="unit-value">${d}</div><div class="unit-label">Days</div></div>
                            <div class="time-unit"><div class="unit-value">${pad(h)}</div><div class="unit-label">Hrs</div></div>
                            <div class="time-unit"><div class="unit-value">${pad(m)}</div><div class="unit-label">Min</div></div>
                            <div class="time-unit"><div class="unit-value">${pad(s)}</div><div class="unit-label">Sec</div></div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
